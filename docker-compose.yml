services:
  realtime-stt-server:
    build:
      context: .
      target: ${WHISPER_OVERLAY_DOCKER_TARGET:-cpu}
    image: realtime-stt-server
    container_name: realtime-stt-server
    command:
      - sh
      - -c
      - ${WHISPER_OVERLAY_SERVER_COMMAND:-python3 realtime-stt-server.py --host 0.0.0.0 --device cpu}
    volumes:
      - cache:/root/.cache
    ports:
      - "7007:7007"

volumes:
  cache:
